{{- if .Values.pairing.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rapidraw-pairing
  labels:
    app.kubernetes.io/name: rapidraw-pairing
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.pairing.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rapidraw-pairing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rapidraw-pairing
    spec:
      containers:
        - name: rapidraw-pairing
          image: {{ .Values.pairing.image | quote }}
          imagePullPolicy: {{ .Values.pairing.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: ADMIN_BUCKET, value: {{ .Values.admin.bucket | quote }} }
            - { name: ADMIN_S3_ENDPOINT, value: {{ .Values.admin.endpoint | quote }} }
            - { name: ADMIN_S3_REGION, value: {{ .Values.admin.region | quote }} }
            - name: ADMIN_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.pairing.existingSecret }}, key: admin-s3-access-key } }
            - name: ADMIN_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.pairing.existingSecret }}, key: admin-s3-secret-key } }
            # Proof-of-proxy for the browser routes; must equal the value the
            # edge `headers` middleware injects (pairing.ingressRoute.browserProxySecret).
            - name: BROWSER_PROXY_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.pairing.existingSecret }}, key: browser-proxy-secret } }
            - { name: OIDC_USERINFO_URL, value: {{ .Values.pairing.oidc.userinfoUrl | quote }} }
            - { name: OIDC_ISSUER_URL, value: {{ .Values.pairing.oidc.issuerUrl | quote }} }
            - { name: OIDC_CLIENT_ID, value: {{ .Values.pairing.oidc.clientId | quote }} }
            - { name: DEFAULT_LIBRARY_ENDPOINT, value: {{ .Values.pairing.defaultLibrary.endpoint | quote }} }
            - { name: DEFAULT_LIBRARY_REGION, value: {{ .Values.pairing.defaultLibrary.region | quote }} }
            - { name: RUST_LOG, value: "info" }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.pairing.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rapidraw-pairing
  labels:
    app.kubernetes.io/name: rapidraw-pairing
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: http }
  selector:
    app.kubernetes.io/name: rapidraw-pairing
{{- end }}
