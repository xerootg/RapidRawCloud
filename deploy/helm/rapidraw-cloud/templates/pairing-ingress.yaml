{{- if and .Values.pairing.enabled .Values.pairing.ingressRoute.enabled }}
{{- $ir := .Values.pairing.ingressRoute }}
{{- if not $ir.forwardAuth.enabled }}
{{- fail "pairing.ingressRoute.enabled=true requires pairing.ingressRoute.forwardAuth.enabled=true: without forward-auth the browser pairing page would be public" }}
{{- end }}
{{- if not $ir.browserProxySecret }}
{{- fail "pairing.ingressRoute.enabled=true requires pairing.ingressRoute.browserProxySecret (must equal the browser-proxy-secret key of pairing.existingSecret; supply it via an encrypted values file)" }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rapidraw-pairing-proxy-secret
spec:
  headers:
    # Overwrites any client-supplied value, so only requests that really
    # passed this edge (after forward-auth) carry the right secret.
    customRequestHeaders:
      X-Rrcloud-Proxy-Secret: {{ $ir.browserProxySecret | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $ir.forwardAuth.middlewareName }}
spec:
  forwardAuth:
    address: {{ $ir.forwardAuth.address | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - X-Authentik-Username
      - X-Authentik-Groups
      - X-Authentik-Email
      - X-Authentik-Name
      - X-Authentik-Uid
      - X-Authentik-Jwt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rapidraw-pairing
spec:
  entryPoints: [websecure]
  routes:
    # App config API validates its own OIDC bearer token — no forward-auth.
    - match: Host(`{{ $ir.host }}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 20
      services:
        - { name: rapidraw-pairing, port: 8080 }
    # Browser pairing page: Authentik forward-auth, THEN the proxy-secret
    # header so the service can tell the request really came through here.
    - match: Host(`{{ $ir.host }}`)
      kind: Rule
      priority: 10
      services:
        - { name: rapidraw-pairing, port: 8080 }
      middlewares:
        - { name: {{ $ir.forwardAuth.middlewareName }} }
        - { name: rapidraw-pairing-proxy-secret }
  tls:
    certResolver: {{ $ir.certResolver }}
    domains:
      - main: {{ $ir.tlsDomainMain }}
        sans: ["*.{{ $ir.tlsDomainMain }}"]
{{- end }}
