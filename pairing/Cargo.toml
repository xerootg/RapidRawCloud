[package]
name = "rrcloud-pairing"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "RapidRawCloud pairing/discovery service: stores per-user sync config in an S3 'admin' bucket behind Authentik, and hands it to devices (OIDC) so a phone configures itself without typing."
license = "AGPL-3.0"

# Standalone crate (own Cargo.lock), like rrcloud-core. Deliberately NOT
# depending on rrcloud-core: this is a tiny config-storage microservice and
# must not pull in the raw-processing / ONNX dependency tree. Its wire
# documents (PairingInfo, PairingConfigDoc) are the generated protocol SDK's,
# so the service, the app and the firmware cannot drift on the pairing shape.

[[bin]]
name = "rrcloud-pairing"
path = "src/main.rs"

[dependencies]
rrcloud-proto = { path = "../protocol/gen/rust/rrcloud-proto" }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "query", "form", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
html-escape = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# base64url-decodes the JWT payload of app bearer tokens for the audience
# (`aud`) check; the tests also use it to build tokens. Already a transitive
# dependency (0.22.x in Cargo.lock), so no new tree.
base64 = "0.22"
