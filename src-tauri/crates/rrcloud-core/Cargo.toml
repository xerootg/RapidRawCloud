[package]
name = "rrcloud-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "RapidRawCloud sync engine core: S3 client (hand-rolled SigV4), journal, manifests, state machines."
license = "AGPL-3.0-only"
publish = false

# Standalone for now: explicitly NOT a member of the src-tauri package/workspace.
# The empty [workspace] table stops cargo from walking up and trying to attach
# this crate to a parent workspace.
[workspace]

[dependencies]
# Promoted from dev-dependency by the transfer-engine unit (P1-U4): the §2.4
# integrity backbone sends a `Content-MD5` header (base64 of the MD5) on
# every single PUT and every multipart part, so the engine itself computes
# MD5s (md-5) and base64-encodes them (base64). Both were already in the
# test build; no new transitive surface.
base64 = "0.22"
blake3 = "1"
# State store (§3.2). The only runtime dependency added by the state-store
# unit: pure Rust, shadow-paging B-tree, commits durable at commit() —
# durability is pinned to Durability::Immediate on every write transaction
# (src/state.rs module docs; not left to redb's default, so a future default
# change cannot weaken §3.2). Empirically verified (P1-U2): cross-process
# second open FAILS immediately (~µs) with DatabaseError::DatabaseAlreadyOpen
# (no blocking), which is exactly the §5.1 app/worker mutual exclusion; the
# file lock is kernel-released on SIGKILL so crash reopen works.
redb = "2"
bytes = "1"
# Manifest gzip NDJSON encode/decode (§2.3: "gzip NDJSON from v1 — a 50k
# library is ~100k+ rows; plain JSON does not survive contact with a
# phone"). The only new dependency added by the journal-engine unit (P1-U3);
# pure-Rust default backend (miniz_oxide), no C toolchain requirement.
flate2 = "1"
# §3.5 mtime restore on download/hydration: stubs and hydrated originals
# must carry the remote original's mtime so the thumbnail cache hash
# (blake3(abs path, mtime, adjustments)) stays stable across hydration.
# Named by the architecture explicitly ("mtime set ... via `filetime`").
filetime = "0.2"
futures = "0.3"
hex = "0.4"
# See the base64 note above (P1-U4 Content-MD5 computation).
md-5 = "0.10"
hmac = "0.12"
percent-encoding = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
# Smart-preview proxy production (ARCHITECTURE.md §4.2, P3). `proxy.rs` is
# feature-independent in this crate and built directly against the SAME
# pinned rawler the host app resolves (`CyberTimon/RapidRAW-DngLab` @
# 934af4b) so proxy color math is bit-for-bit the app's — no rawler fork or
# port (§4.2 "NO rawler fork needed"). Pinned by `rev` because this crate is
# standalone (its own lockfile); the host app pins the same rev via its lock.
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git", rev = "934af4b213a12b95f77d69529627067056066294" }
# Lanczos3 linear-space resample + q75 JPEG thumb encode (§4.2 steps 5/8),
# matching the host app's `image` major so the proxy path and the app agree.
image = "0.25"
# Parallel rows for the §4.2 step-5 linear-space Lanczos3 resample in
# `proxy.rs`. Pure Rust and already in the tree transitively via rawler, so
# this adds no new toolchain surface; it keeps the full-resolution proxy
# downscale (and the fidelity suite's matched resample) from dominating the
# generation cost.
rayon = "1"
# 0.13 matches the reqwest/rustls stack the host app (src-tauri) already
# ships, so joining the workspace does not pull in a second HTTP stack
# (§3.9 rationale). The rustls-platform-verifier hookup lands with the
# workspace integration.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
# NOTE: serde_json feature hygiene for §2.5 hash determinism — load-bearing
# once this crate joins the src-tauri workspace, where ANY dependency's
# features unify into this build:
# - `arbitrary_precision` must stay OFF. Under it, Number::to_string()
#   preserves the source spelling, so the ryu fallback in
#   semhash::write_canonical_number becomes spelling-dependent and
#   sem_hash({"exposure":0.36}) != sem_hash({"exposure":3.6e-1}) — exactly
#   the churn §2.5 kills. Pinned by tests/semhash.rs
#   `canonical_json_normalizes_number_spellings` /
#   `number_respelling_does_not_change_hash` (the 0.25 vs 2.5e-1 cases),
#   which fail in a unified build that enables the feature.
# - `preserve_order` is harmless by construction (canonicalization re-sorts
#   through a BTreeMap, never relying on Map's backing store) but stays off
#   so nothing comes to depend on map ordering.
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Promoted from dev-dependency by the transfer-engine unit (P1-U4): the
# streamed per-part/source reads use `tokio::fs`/`io-util`. No new
# transitive surface: reqwest 0.13 (above) already drives tokio on every
# async path, so this only makes the existing runtime dependency explicit.
# No runtime features (`rt`/`macros`) and no `sync` — the engine never
# spawns; the §2.4 transfer-concurrency cap is structural (the pump's
# `FuturesUnordered` length never exceeds the cap, polled on the caller's
# runtime), so no semaphore is needed. `tokio_util` (CancellationToken) is
# deliberately NOT added: the pump's cancel flag is a plain atomic (see
# `transfer::CancelFlag`).
tokio = { version = "1", default-features = false, features = [
    "fs",
    "io-util",
] }
# `parsing` added by the P1-U4 review round: the stale-upload orphan sweep
# age-gates backend-listed uploads on their `Initiated` timestamp (RFC 3339),
# so it never aborts a live sibling upload it cannot prove stale. Same crate,
# one more feature — no new dependency.
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
unicode-normalization = "0.1"

[features]
# Test-support surface: the `force_*` tamper/corruption helpers in
# `state.rs` that integration tests use to model meta corruption and
# counter tampering. Gated so release builds of the library do not carry
# methods that can corrupt the exact invariants the state store exists to
# protect; the self-dev-dependency below turns it on for this crate's own
# test builds only (P1-U2 review finding).
test-util = []

[dev-dependencies]
# Self-dependency: enables `test-util` when building this crate's tests,
# without any production build ever carrying the feature.
rrcloud-core = { path = ".", features = ["test-util"] }
# P3 proxy suite decodes the emitted JPEG thumbs to assert their long edge
# (tests/proxy.rs). Same major as the [dependencies] entry.
image = "0.25"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-util",
] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Crash-injection + lock-exclusivity suite for the redb state store (§2.1.5,
# §5.1). harness = false: the binary re-execs itself as a writer/locker child
# (dispatched on an env var), and the parent SIGKILLs it mid-commit-loop —
# libtest's harness would get in the way of child stdout and exit codes.
[[test]]
name = "state_crash"
harness = false

# Crash-injection suite for the transfer engine (§2.4 multipart resume):
# the binary re-execs itself as an uploading child against the shared
# Garage server, the parent SIGKILLs it between completed parts
# (coordinated by part-complete ACK lines), then resumes with a fresh
# engine instance and asserts completed parts are never re-uploaded.
# harness = false for the same reason as state_crash.
[[test]]
name = "transfer_crash"
harness = false
