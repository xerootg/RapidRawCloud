[package]
name = "rrcloud-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "RapidRawCloud sync engine core: S3 client (hand-rolled SigV4), journal, manifests, state machines."
license = "AGPL-3.0-only"
publish = false

# Standalone for now: explicitly NOT a member of the src-tauri package/workspace.
# The empty [workspace] table stops cargo from walking up and trying to attach
# this crate to a parent workspace.
[workspace]

[dependencies]
blake3 = "1"
# State store (§3.2). The only runtime dependency added by the state-store
# unit: pure Rust, shadow-paging B-tree, commits durable at commit() with the
# default durability — empirically verified (P1-U2): cross-process second
# open FAILS immediately (~µs) with DatabaseError::DatabaseAlreadyOpen (no
# blocking), which is exactly the §5.1 app/worker mutual exclusion; the file
# lock is kernel-released on SIGKILL so crash reopen works.
redb = "2"
bytes = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
# 0.13 matches the reqwest/rustls stack the host app (src-tauri) already
# ships, so joining the workspace does not pull in a second HTTP stack
# (§3.9 rationale). The rustls-platform-verifier hookup lands with the
# workspace integration.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
# NOTE: serde_json feature hygiene for §2.5 hash determinism — load-bearing
# once this crate joins the src-tauri workspace, where ANY dependency's
# features unify into this build:
# - `arbitrary_precision` must stay OFF. Under it, Number::to_string()
#   preserves the source spelling, so the ryu fallback in
#   semhash::write_canonical_number becomes spelling-dependent and
#   sem_hash({"exposure":0.36}) != sem_hash({"exposure":3.6e-1}) — exactly
#   the churn §2.5 kills. Pinned by tests/semhash.rs
#   `canonical_json_normalizes_number_spellings` /
#   `number_respelling_does_not_change_hash` (the 0.25 vs 2.5e-1 cases),
#   which fail in a unified build that enables the feature.
# - `preserve_order` is harmless by construction (canonicalization re-sorts
#   through a BTreeMap, never relying on Map's backing store) but stays off
#   so nothing comes to depend on map ordering.
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
unicode-normalization = "0.1"

[dev-dependencies]
base64 = "0.22"
md-5 = "0.10"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-util",
] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Crash-injection + lock-exclusivity suite for the redb state store (§2.1.5,
# §5.1). harness = false: the binary re-execs itself as a writer/locker child
# (dispatched on an env var), and the parent SIGKILLs it mid-commit-loop —
# libtest's harness would get in the way of child stdout and exit codes.
[[test]]
name = "state_crash"
harness = false
