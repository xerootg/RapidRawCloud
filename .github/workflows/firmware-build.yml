name: 'Reusable: ESP-IDF build of rrcloud-ingest (esp32p4)'

# The one definition of "build the firmware": the CI workflow (firmware.yml) and the release
# workflow (firmware-release.yml) both call it, so the container image, target and the set of
# artifacts cannot drift between a PR check and a release. One call builds one board
# (firmware/rrcloud-ingest/main/Kconfig.projbuild) for one ESP32-P4 chip generation: the
# board's sdkconfig overlay, then sdkconfig.chip_rev3 for rev 3 silicon, on sdkconfig.defaults.
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the uploaded build artifact
        type: string
        default: rrcloud-ingest-esp32p4
      idf-image:
        description: espressif/idf container tag
        type: string
        default: v5.5.5
      version:
        description: Version string to build in instead of version.txt (test builds; empty = version.txt)
        type: string
        default: ''
      ref:
        description: Commit to build (empty = the triggering one; for a pull request that is its merge with the base)
        type: string
        default: ''
      board:
        description: "poe-eth (ESP32-P4-WIFI6-POE-ETH), poe-eth-dsi5 (the same board with a 5-inch Raspberry Pi DSI touch display), touch-lcd-43 (ESP32-P4-WIFI6-Touch-LCD-4.3, chip rev < 3) or touch-lcd-43-rev3 (same board, chip rev >= 3)"
        type: string
        default: poe-eth
    outputs:
      version:
        description: The version the image reports (the version input, else version.txt)
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: ESP-IDF build (esp32p4, ${{ inputs.board }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:${{ inputs.idf-image }}
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: idf.py build
        id: build
        shell: bash
        env:
          RRC_FW_VERSION: ${{ inputs.version }}   # CMakeLists.txt prefers it over version.txt
        run: |
          git config --global --add safe.directory '*'
          . $IDF_PATH/export.sh
          cd firmware/rrcloud-ingest
          case "${{ inputs.board }}" in
            poe-eth) DEFAULTS="sdkconfig.defaults" ;;
            poe-eth-dsi5) DEFAULTS="sdkconfig.defaults;sdkconfig.board.poe_eth_dsi5" ;;
            touch-lcd-43) DEFAULTS="sdkconfig.defaults;sdkconfig.board.touch_lcd_43" ;;
            touch-lcd-43-rev3) DEFAULTS="sdkconfig.defaults;sdkconfig.board.touch_lcd_43;sdkconfig.chip_rev3" ;;
            *) echo "::error::unknown board ${{ inputs.board }}"; exit 1 ;;
          esac
          idf.py -DSDKCONFIG_DEFAULTS="$DEFAULTS" set-target esp32p4
          idf.py -DSDKCONFIG_DEFAULTS="$DEFAULTS" build
          idf.py size
          # The component manager must not need to change the committed lock for either board.
          git diff --exit-code -- dependencies.lock
          echo "version=${RRC_FW_VERSION:-$(tr -d ' \n\r' < version.txt)}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          # Paths are kept relative to build/ so flash_args stays valid for merge_bin.
          path: |
            firmware/rrcloud-ingest/build/rrcloud-ingest.bin
            firmware/rrcloud-ingest/build/rrcloud-ingest.elf
            firmware/rrcloud-ingest/build/bootloader/bootloader.bin
            firmware/rrcloud-ingest/build/partition_table/partition-table.bin
            firmware/rrcloud-ingest/build/ota_data_initial.bin
            firmware/rrcloud-ingest/build/flasher_args.json
            firmware/rrcloud-ingest/build/flash_args
          if-no-files-found: error
