name: worker-image

# Builds the headless rrcloud-worker container and publishes it to GHCR.
# Public image (OSS fork convention) so the homelab CronJob and any free-tier
# box can pull without registry credentials.
on:
  push:
    branches: [main, cloud, ccr-70e6b1a3-bux8cz]
    paths:
      - 'src-tauri/crates/rrcloud-core/**'
      - 'worker/Dockerfile'
      - '.github/workflows/worker-image.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rrcloud-worker
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # rrcloud-core is a standalone crate (own Cargo.lock); build context is
          # the crate dir so the image carries no app/tauri code.
          context: src-tauri/crates/rrcloud-core
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
