name: rrcloud

on:
  push:
    paths:
      - 'src-tauri/crates/rrcloud-core/**'
      - '.github/workflows/rrcloud.yml'
  pull_request:
    paths:
      - 'src-tauri/crates/rrcloud-core/**'
      - '.github/workflows/rrcloud.yml'

permissions:
  contents: read

jobs:
  rrcloud-core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri/crates/rrcloud-core
    steps:
      - uses: actions/checkout@v4

      # This crate lives under src-tauri/, whose rust-toolchain.toml pins the
      # channel to 1.98. That pin is resolved by walking up from the working
      # directory, so it applies to this standalone crate too and overrides
      # whatever toolchain is installed — rustfmt/clippy must therefore be
      # installed FOR 1.98, not for `stable`. The old `@stable` install left
      # cargo-fmt/clippy absent on the 1.98 toolchain cargo actually selects
      # here, which failed `cargo fmt --check` on every CI run.
      - name: Install Rust (1.98, matching the project pin)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates/rrcloud-core

      # The integration suite spawns a real Garage v2.2.0. GitHub Actions sets
      # CI=true, which makes the test harness panic (not skip) if the binary
      # is missing, so a failed fetch can never pass vacuously.
      - name: Fetch Garage
        run: scripts/fetch-garage.sh

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
