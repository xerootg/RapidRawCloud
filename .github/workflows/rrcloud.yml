name: rrcloud

on:
  push:
    paths:
      - 'src-tauri/crates/rrcloud-core/**'
      - '.github/workflows/rrcloud.yml'
  pull_request:
    paths:
      - 'src-tauri/crates/rrcloud-core/**'
      - '.github/workflows/rrcloud.yml'

permissions:
  contents: read

jobs:
  rrcloud-core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri/crates/rrcloud-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates/rrcloud-core

      # The integration suite spawns a real Garage v2.2.0. GitHub Actions sets
      # CI=true, which makes the test harness panic (not skip) if the binary
      # is missing, so a failed fetch can never pass vacuously.
      - name: Fetch Garage
        run: scripts/fetch-garage.sh

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
