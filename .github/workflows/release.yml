name: 'Release: Build & Package App'

on:
  release:
    types: [created]

jobs:
  # Obtainium (and Android's package manager) only picks up an update when the
  # app version actually changes, so a release tag whose x.y.z prefix doesn't
  # match tauri.conf.json would ship an APK that installed users never receive.
  # Fail fast instead of building 20+ assets with a stale version.
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag version must match tauri.conf.json
        run: |
          tag='${{ github.event.release.tag_name }}'
          tag_ver=$(echo "$tag" | sed -E 's/^v//; s/[-+].*$//')
          conf_ver=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=$tag tag_ver=$tag_ver conf_ver=$conf_ver"
          [ "$tag_ver" = "$conf_ver" ] || { echo "::error::release tag $tag does not match tauri.conf.json version $conf_ver — bump the app version so Obtainium sees the update"; exit 1; }

  release:
    needs: version-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            builds-args: '--bundles nsis'
            target: ''
            asset-prefix: '01'
          - platform: 'windows-11-arm'
            builds-args: '--bundles nsis'
            target: 'aarch64-pc-windows-msvc'
            asset-prefix: '01'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-14'
            target: aarch64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_tethering'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            args: '--features tethering'
            asset-prefix: '02_tethering'
          - platform: 'ubuntu-22.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_tethering'
          - platform: 'ubuntu-24.04'
            target: ''
            args: '--features tethering'
            asset-prefix: '03_tethering'
          - platform: 'ubuntu-latest'
            mobile: 'android'
            target: 'aarch64-linux-android'
            args: '--target aarch64'
            asset-prefix: '04'
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ github.event.release.id }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch][ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
      mobile: ${{ matrix.mobile }}
    secrets: inherit
    permissions:
      contents: write
