name: 'Firmware: rrcloud-ingest (ESP32-P4)'

on:
  push:
    branches: [main]
    paths:
      - 'firmware/rrcloud-ingest/**'
      - 'protocol/**'
      - 'src-tauri/crates/rrcloud-core/tests/firmware_interop.rs'
      - '.github/workflows/firmware.yml'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/rrcloud-ingest/**'
      - 'protocol/**'
      - 'src-tauri/crates/rrcloud-core/tests/firmware_interop.rs'
      - '.github/workflows/firmware.yml'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (gcc) + Rust interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the pure-component test-suite
        run: |
          cd firmware/rrcloud-ingest/host_tests
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Regenerate interop fixtures and check they are committed
        run: |
          cd firmware/rrcloud-ingest/host_tests
          ./build/test_proto /tmp/manifest_test.gz fixtures
          git diff --exit-code -- fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates/rrcloud-core
      - name: rrcloud-core decodes the firmware's documents
        run: |
          cd src-tauri/crates/rrcloud-core
          cargo test --test firmware_interop

  ui-sim:
    name: On-screen UI simulator (LVGL on the host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run (renders every screen, drives it with touches, ASan/UBSan, leak check)
        run: |
          cmake -S firmware/rrcloud-ingest/ui_sim -B /tmp/ui_sim
          cmake --build /tmp/ui_sim -j"$(nproc)"
          /tmp/ui_sim/rrc_ui_sim /tmp/ui_sim/shots
          /tmp/ui_sim/rrc_ui_sim /tmp/ui_sim/shots-landscape landscape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rrc-ui-screenshots
          path: |
            /tmp/ui_sim/shots/*.png
            /tmp/ui_sim/shots-landscape/*.png

  # Builds of a pull request (or of any branch, run by hand) carry their commit in the
  # version, because they also become the dock's test-build channel (publish-dev below).
  # The images are built from that commit (the pull request's head, not the merge with
  # the base the other checks run on), so the version, the manifest and the firmware-dev
  # tag all name the source the image came from.
  meta:
    name: Resolve the build's version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V="$(tr -d ' \n\r' < firmware/rrcloud-ingest/version.txt)"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then V="${V}-dev.${SHA:0:7}"; fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "building ${V}"

  esp-idf-build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        board: [poe-eth, poe-eth-dsi5, touch-lcd-43, touch-lcd-43-rev3]
    uses: ./.github/workflows/firmware-build.yml
    with:
      board: ${{ matrix.board }}
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact-name: rrcloud-ingest-esp32p4-${{ matrix.board }}

  # The dock's test-build channel: every green build of a pull request from this
  # repository (or a hand-run build of any branch) replaces the rolling firmware-dev
  # prerelease, which a dock with "Test builds" on installs from (main/ota.c). The last
  # build wins; the manifest and release notes say which branch and commit it is.
  publish-dev:
    name: Publish to the firmware-dev test channel
    needs: [meta, host-tests, ui-sim, esp-idf-build]
    # success(): a red test or board build must not replace the channel
    if: success() && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: firmware-dev
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rrcloud-ingest-esp32p4-*
          path: artifacts
      - name: Images and manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p builds
          for d in artifacts/rrcloud-ingest-esp32p4-*; do mkdir -p "builds/${d#artifacts/rrcloud-ingest-esp32p4-}"; cp "$d/rrcloud-ingest.bin" "$d/rrcloud-ingest.elf" "builds/${d#artifacts/rrcloud-ingest-esp32p4-}/"; done
          python3 .github/scripts/ota_manifest.py builds dist "$VERSION" firmware-dev "${SHA:0:7}"
      - name: Replace the firmware-dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh release delete firmware-dev --cleanup-tag --yes -R "${GITHUB_REPOSITORY}" || true
          {
            echo "Test build of \`${BRANCH}\` at ${SHA} (version ${VERSION})."
            echo
            echo "Rolling: replaced by every build of a firmware pull request. A dock installs it with Device › Firmware › Test builds on, or from its web page."
          } > notes.md
          gh release create firmware-dev -R "${GITHUB_REPOSITORY}" --target "${SHA}" --prerelease --latest=false \
            --title "rrcloud-ingest test build (${BRANCH})" --notes-file notes.md dist/*
