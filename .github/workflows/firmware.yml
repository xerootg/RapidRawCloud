name: 'Firmware: rrcloud-ingest (ESP32-P4)'

on:
  push:
    branches: [main]
    paths:
      - 'firmware/rrcloud-ingest/**'
      - 'protocol/**'
      - 'src-tauri/crates/rrcloud-core/tests/firmware_interop.rs'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/rrcloud-ingest/**'
      - 'protocol/**'
      - 'src-tauri/crates/rrcloud-core/tests/firmware_interop.rs'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (gcc) + Rust interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the pure-component test-suite
        run: |
          cd firmware/rrcloud-ingest/host_tests
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Regenerate interop fixtures and check they are committed
        run: |
          cd firmware/rrcloud-ingest/host_tests
          ./build/test_proto /tmp/manifest_test.gz fixtures
          git diff --exit-code -- fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/crates/rrcloud-core
      - name: rrcloud-core decodes the firmware's documents
        run: |
          cd src-tauri/crates/rrcloud-core
          cargo test --test firmware_interop

  esp-idf-build:
    name: ESP-IDF v5.5 build (esp32p4)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/rrcloud-ingest
          idf.py set-target esp32p4
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: rrcloud-ingest-esp32p4
          path: |
            firmware/rrcloud-ingest/build/rrcloud-ingest.bin
            firmware/rrcloud-ingest/build/bootloader/bootloader.bin
            firmware/rrcloud-ingest/build/partition_table/partition-table.bin
            firmware/rrcloud-ingest/build/ota_data_initial.bin
            firmware/rrcloud-ingest/build/flasher_args.json
