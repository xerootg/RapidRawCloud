[package]
name = "tauri-plugin-rrcloud"
version = "0.1.0"
authors = [ "xerootg" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-rrcloud"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1"
rrcloud-proto = { path = "../protocol/gen/rust/rrcloud-proto" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
