## IDF Component Manager manifest
dependencies:
  idf:
    version: ">=5.5"
  # USB mass-storage class driver (Sigma fp in Mass Storage mode).
  espressif/usb_host_msc: "^1.1.1"
  # Wi-Fi API proxied over SDIO to the on-board ESP32-C6 (pulls in esp_hosted on esp32p4).
  espressif/esp_wifi_remote: "*"
  # Power-loss-safe filesystem for the sync ledger and frozen journal segments.
  joltwallet/littlefs: "^1.14"
  # rrcloud-ingest.local
  espressif/mdns: "^1.4"
  # On-screen UI (ESP32-P4-WIFI6-Touch-LCD-4.3; compiled for every board, linked only where
  # CONFIG_RRC_HAS_DISPLAY pulls it in). LVGL 9 + the ST7701 MIPI-DSI panel and GT911 touch drivers.
  # Exact pin, the same version ui_sim/ fetches: the UI is tested against it. 9.6+ also
  # declares Kconfig-conditional dependencies that fail to resolve here (IDF 5.5.0's
  # component manager: MissingKconfigError LV_USE_FREETYPE; 5.5.5's: a failed re-run).
  lvgl/lvgl: "==9.5.0"
  espressif/esp_lcd_st7701: "^2.0.2"
  espressif/esp_lcd_touch_gt911: "^1.2.1"
